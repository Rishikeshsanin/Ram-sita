<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100f20">
  <meta name="description" content="Ram–Sita: the childhood paper-chit game, reimagined for friends together in the same room.">
  <title>RAM–SITA · The Royal Guessing Game</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Ram–Sita home">
        <span class="brand-mark">ॐ</span>
        <span><strong>RAM<span class="brand-dash">–</span>SITA</strong><small>THE ROYAL GUESSING GAME</small></span>
      </a>
      <div class="connection" id="connection" role="status" aria-live="polite"><span class="connection-dot"></span><span>Getting ready</span></div>
    </header>
    <main id="view" aria-live="polite"></main>
    <footer class="footer"><span>Made for the friends across the table.</span><span>No downloads. No scrolling. Just chaos.</span></footer>
  </div>
  <div id="toast" role="alert" aria-live="assertive"></div>
</body>
</html>
