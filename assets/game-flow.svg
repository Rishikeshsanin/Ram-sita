<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
<title id="title">Ram–Sita gameplay flow</title>
<desc id="desc">Five stages: gather friends, secret cards, everyone confirms ready, Rama guesses Sita, and characters reveal with scores.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#191529"/><stop offset="1" stop-color="#282038"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbe3ad"/><stop offset="1" stop-color="#dc985e"/></linearGradient>
</defs>
<rect width="1200" height="220" rx="20" fill="url(#bg)"/>
<rect x="12" y="12" width="1176" height="196" rx="15" fill="none" stroke="#dfb585" stroke-opacity=".25"/>
<g font-family="Arial,sans-serif">
  <g fill="none" stroke="#b99c99" stroke-opacity=".4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M229 110h39m-8-8 8 8-8 8"/><path d="M458 110h39m-8-8 8 8-8 8"/><path d="M687 110h39m-8-8 8 8-8 8"/><path d="M916 110h39m-8-8 8 8-8 8"/>
  </g>
  <g transform="translate(34 30)"><rect width="188" height="160" rx="16" fill="#302741" stroke="#cba46f" stroke-opacity=".35"/><circle cx="94" cy="49" r="27" fill="#e4b778" fill-opacity=".13" stroke="#e6bd85"/><circle cx="85" cy="42" r="6" fill="url(#gold)"/><circle cx="103" cy="42" r="6" fill="url(#gold)"/><path d="M69 64q25-22 50 0" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/><text x="94" y="106" text-anchor="middle" fill="#ffe2ac" font-size="17" font-weight="700">GATHER</text><text x="94" y="127" text-anchor="middle" fill="#c6bacb" font-size="11">3–10 friends join</text><text x="94" y="143" text-anchor="middle" fill="#c6bacb" font-size="11">one private room</text></g>
  <g transform="translate(263 30)"><rect width="188" height="160" rx="16" fill="#302741" stroke="#cba46f" stroke-opacity=".35"/><rect x="76" y="22" width="36" height="57" rx="5" fill="#61415c" stroke="#f7cb8a" stroke-width="2"/><path d="M94 34l10 15-10 15-10-15Z" fill="url(#gold)"/><text x="94" y="106" text-anchor="middle" fill="#ffe2ac" font-size="17" font-weight="700">DEAL</text><text x="94" y="127" text-anchor="middle" fill="#c6bacb" font-size="11">Each player sees</text><text x="94" y="143" text-anchor="middle" fill="#c6bacb" font-size="11">one secret card</text></g>
  <g transform="translate(492 30)"><rect width="188" height="160" rx="16" fill="#302741" stroke="#cba46f" stroke-opacity=".35"/><circle cx="94" cy="49" r="27" fill="#b4dab1" fill-opacity=".09" stroke="#a0c7a3"/><path d="M81 49l9 9 19-22" stroke="#b7e8b3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="94" y="106" text-anchor="middle" fill="#ffe2ac" font-size="17" font-weight="700">READY</text><text x="94" y="127" text-anchor="middle" fill="#c6bacb" font-size="11">Timer waits until</text><text x="94" y="143" text-anchor="middle" fill="#c6bacb" font-size="11">everybody confirms</text></g>
  <g transform="translate(721 30)"><rect width="188" height="160" rx="16" fill="#302741" stroke="#cba46f" stroke-opacity=".35"/><circle cx="94" cy="49" r="27" fill="#e4b778" fill-opacity=".13" stroke="#e6bd85"/><path d="M106 32q-29 17 0 34M106 33v33M78 49h42m-9-7 9 7-9 7" stroke="#f9d8a5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="106" text-anchor="middle" fill="#ffe2ac" font-size="17" font-weight="700">GUESS</text><text x="94" y="127" text-anchor="middle" fill="#c6bacb" font-size="11">Rama picks Sita</text><text x="94" y="143" text-anchor="middle" fill="#c6bacb" font-size="11">before time runs out</text></g>
  <g transform="translate(950 30)"><rect width="218" height="160" rx="16" fill="#493347" stroke="#f3c17d" stroke-opacity=".8"/><circle cx="109" cy="49" r="27" fill="#f4c68c" fill-opacity=".12" stroke="#eec68b"/><path d="M90 39l6 23h26l6-23-12 7-7-16-8 16Z" fill="url(#gold)"/><text x="109" y="106" text-anchor="middle" fill="#ffe2ac" font-size="17" font-weight="700">REVEAL</text><text x="109" y="127" text-anchor="middle" fill="#e1c9ce" font-size="11">All roles and scores</text><text x="109" y="143" text-anchor="middle" fill="#e1c9ce" font-size="11">appear together</text></g>
</g>
</svg>