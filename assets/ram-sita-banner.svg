  <radialGradient id="glow" cx=".69" cy=".37" r=".6"><stop stop-color="#94577b" stop-opacity=".45"/><stop offset=".6" stop-color="#51396d" stop-opacity=".15"/><stop offset="1" stop-color="#51396d" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2c2"/><stop offset=".48" stop-color="#f4c578"/><stop offset="1" stop-color="#c78445"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#604365"/><stop offset=".5" stop-color="#332644"/><stop offset="1" stop-color="#1d1b38"/></linearGradient>
  <linearGradient id="front" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#997258"/><stop offset=".22" stop-color="#7c5266"/><stop offset=".63" stop-color="#46304e"/><stop offset="1" stop-color="#25233c"/></linearGradient>
