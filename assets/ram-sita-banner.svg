<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
<title id="title">RAM–SITA — The Royal Guessing Game</title>
<desc id="desc">Dark royal purple and gold illustration featuring three secret character cards, Rama, Sita and Ravana, with the tagline One secret. One guess. Endless drama.</desc>
<defs>
