name: Capture genuine README screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Capture screenshots using a real three-player local server
        run: CAPTURE_SHOWCASE=1 npx playwright test browser/showcase.spec.js --reporter=list
      - name: Verify and commit actual PNG screenshots to this branch
        run: |
          test "$(find docs/screenshots -name '*.png' -type f | wc -l)" -eq 7
          file docs/screenshots/*.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          git diff --cached --quiet || git commit -m "docs: add actual Chromium screenshots of Ram–Sita Classic"
          git push origin HEAD:${GITHUB_REF_NAME}
