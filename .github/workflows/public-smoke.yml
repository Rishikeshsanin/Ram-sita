name: Public Ram–Sita smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-smoke.yml'
      - 'smoke/live-smoke.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node smoke/live-smoke.js
